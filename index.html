<!DOCTYPE html><html lang="si"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>HOME BUDGET</title><link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#0B5ED7"><style>*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:system-ui,'Noto Sans Sinhala',sans-serif;background:#EAF2FF;color:#0A2540;overflow:hidden}.hdr{background:linear-gradient(135deg,#0B5ED7,#38BDF8);color:#fff;padding:8px 10px 8px;text-align:center;border-radius:0 0 18px 18px}.hdr h1{margin:0;font-size:19px}.hdr .ym{font-size:14px;font-weight:700}.hdr .st{font-size:11px;background:#4ADE80;color:#06281A;padding:2px 10px;border-radius:20px;display:inline-block;margin-top:3px;font-weight:800}.banner{margin:6px 10px 0;border-radius:12px;overflow:hidden;height:92px}.banner img{width:100%;height:100%;object-fit:cover;display:block}.cards{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:7px 10px 0}.card{background:#CDE6FF;border-radius:12px;padding:7px;text-align:center;cursor:pointer}.card small{font-size:12px}.card b{font-size:15px;display:block}.blue{margin:7px 10px 0;background:#0B5ED7;color:#fff;border:none;border-radius:12px;padding:11px;font-size:15px;font-weight:800;width:calc(100% - 20px);cursor:pointer}.box{background:#fff;margin:7px 10px 0;border-radius:12px;padding:8px}.box b{font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:6px}.btn{background:#A9D1FF;border:none;border-radius:10px;padding:9px 2px;font-size:12px;font-weight:700;cursor:pointer}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #D6E6FF}.tabs button{flex:1;padding:11px 2px;border:none;background:#fff;font-size:13px;font-weight:700}.tabs button.on{color:#0B5ED7}.page{display:none;height:calc(100% - 52px);overflow-y:auto;padding-bottom:8px}.page.on{display:block}.inp{width:100%;padding:10px;border:1px solid #B9D6FF;border-radius:10px;margin:4px 0;font-size:14px}.save{background:#FACC15;border:none;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid #E6F0FF}.phone{background:#FACC15;border:none;border-radius:8px;padding:6px 8px;font-size:11px;font-weight:800}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}.cal div{padding:8px 2px;text-align:center;background:#EAF2FF;border-radius:8px;font-size:12px;cursor:pointer}.cal div.has{background:#FACC15;font-weight:800}</style></head><body>
<div id="page-home" class="page on">
<div class="hdr"><h1>🏠 HOME BUDGET</h1><div class="ym" id="ym">2026</div><div class="st" id="trialLabel">Trial Version</div></div>
<div class="banner"><img src="./home.jpg"></div>
<div class="cards"><div class="card" onclick="openCard('inc')"><small>මාසික ආදායම</small><b id="sInc">රු. 0</b></div><div class="card" onclick="openCard('exp')"><small>මාසික වියදම</small><b id="sExp">රු. 0</b></div><div class="card" onclick="openCard('bal')"><small>ඉතිරිය</small><b id="sBal">රු. 0</b></div><div class="card" onclick="openCard('today')"><small>අද වියදම</small><b id="sToday">රු. 0</b></div></div>
<button class="blue" onclick="openPage('must')">අනිවාර්ය ගෙවීම්</button>
<div class="box"><b>💸 වියදම්</b><div class="grid"><button class="btn" onclick="openCat('ආහාර')">🍚<br>ආහාර</button><button class="btn" onclick="openCat('බිල්පත්')">🧾<br>බිල්පත්</button><button class="btn" onclick="openCat('දරුවන්')">👧<br>දරුවන්</button><button class="btn" onclick="openCat('සෞඛ්‍යය')">💊<br>සෞඛ්‍යය</button><button class="btn" onclick="openCat('වාහනය')">🚗<br>වාහනය</button><button class="btn" onclick="openCat('ණය')">💳<br>ණය</button></div></div>
<button class="blue" onclick="openCat('දවසේ අනෙකුත් වියදම්')">දවසේ අනෙකුත් වියදම්</button>
</div>
<div id="page-detail" class="page"><div style="padding:10px"><button class="save" onclick="backHome()">← ආපසු</button><h3 id="dTitle" style="margin:8px 0"></h3><div id="dForm"></div><div id="dTable" style="font-size:13px"></div></div></div>
<div id="page-report" class="page"><div style="padding:10px"><div class="box"><b>📊 මාසික වාර්තාව - <span id="repMonth"></span></b><div id="repSummary" style="font-size:13px;line-height:1.7"></div><div class="cal" id="cal"></div><div id="dayDetail" style="font-size:12px;margin-top:8px"></div><button class="save" onclick="downloadPDF()">📄 A4 PDF Download</button></div></div></div>
<div id="page-settings" class="page"><div style="padding:10px"><div class="box"><b>⚙️ සැකසුම්</b><label>ගෙදර නම</label><input class="inp" id="setHome" placeholder="අපේ ගෙදර"><button class="save" onclick="saveSet('home')">Save</button><label style="margin-top:8px;display:block">මාසේ Budget එක (රු.)</label><input class="inp" id="setBudget" type="number" placeholder="80000"><button class="save" onclick="saveSet('budget')">Save</button><div id="setMsg" style="font-size:12px;color:green"></div></div>
<div class="box"><b>🔑 Key</b><div id="keyStatus" style="font-size:12px"></div><input class="inp" id="keyInput" placeholder="RDK-XXXX-XXXX-1M-XXXX"><button class="save" onclick="activateKey()">Key දාන්න</button><div id="keyMsg" style="font-size:12px"></div></div>
<div class="box"><b>✏️ Edit / Delete - Category එකක් තෝරන්න</b><div class="grid"><button class="btn" onclick="openManage('ආදායම')">ආදායම</button><button class="btn" onclick="openManage('අනිවාර්ය ගෙවීම්')">අනිවාර්ය ගෙවීම්</button><button class="btn" onclick="openManage('ආහාර')">ආහාර</button><button class="btn" onclick="openManage('බිල්පත්')">බිල්පත්</button><button class="btn" onclick="openManage('දරුවන්')">දරුවන්</button><button class="btn" onclick="openManage('සෞඛ්‍යය')">සෞඛ්‍යය</button><button class="btn" onclick="openManage('වාහනය')">වාහනය</button><button class="btn" onclick="openManage('ණය')">ණය</button><button class="btn" onclick="openManage('දවසේ අනෙකුත් වියදම්')">දවසේ අනෙකුත් වියදම්</button></div><div id="manageList" style="font-size:12px;margin-top:6px"></div></div></div></div>
<div class="tabs"><button id="tHome" class="on" onclick="go('home')">🏠 මුල් පිටුව</button><button id="tReport" onclick="go('report')">📊 මාසික වාර්තාව</button><button id="tSet" onclick="go('settings')">⚙️ සැකසුම්</button></div>
<script>
var MONTHS=['ජනවාරි','පෙබරවාරි','මාර්තු','අප්‍රේල්','මැයි','ජූනි','ජූලි','අගෝස්තු','සැප්තැම්බර්','ඔක්තෝබර්','නොවැම්බර්','දෙසැම්බර්'];
var D=JSON.parse(localStorage.getItem('hb_v3')||'{}'); if(!D.inc)D.inc=[]; if(!D.exp)D.exp=[]; if(!D.must)D.must=[]; if(!D.install)D.install=new Date().toISOString().slice(0,10);
function persist(){localStorage.setItem('hb_v3',JSON.stringify(D))}
function today(){return new Date().toISOString().slice(0,10)} function month(){return today().slice(0,7)}
function go(p){['home','detail','report','settings'].forEach(function(x){document.getElementById('page-'+x).classList.toggle('on',x===p)}); document.getElementById('tHome').classList.toggle('on',p==='home');document.getElementById('tReport').classList.toggle('on',p==='report');document.getElementById('tSet').classList.toggle('on',p==='settings'); if(p==='report')renderReport(); if(p==='settings')renderManage(''); render();}
function backHome(){go('home')}
function daysLeft(){var s=new Date(D.install); s.setDate(s.getDate()+7); return Math.max(0,Math.ceil((s-new Date())/86400000))}
function isActivated(){return !!(D.activated && D.activated>=today())}
function validateKey(k){k=k.trim().toUpperCase(); var m=k.match(/^RDK-(\d{4})-(\d{4})-(\d+)([MDY])-(\d{4})$/); if(!m)return null; var c=(parseInt(m[1])*7+parseInt(m[2])*13+parseInt(m[3])*29+4317)%10000; if(c!==parseInt(m[5]))return null; var e=new Date(); if(m[4]==='M')e.setMonth(e.getMonth()+parseInt(m[3])); else if(m[4]==='Y')e.setFullYear(e.getFullYear()+parseInt(m[3])); else e.setDate(e.getDate()+parseInt(m[3])); return e.toISOString().slice(0,10)}
function activateKey(){var exp=validateKey(document.getElementById('keyInput').value); if(!exp){document.getElementById('keyMsg').textContent='Key එක වැරදියි.';return} var m=document.getElementById('keyInput').value.trim().toUpperCase().match(/^RDK-(\d{4})-(\d{4})-(\d+)([MDY])-(\d{4})$/); D.activated=exp;D.key=document.getElementById('keyInput').value;D.keyLabel=m[4]==='M'?m[3]+' Month':m[4]==='Y'?m[3]+' Year':m[3]+' Day';D.keyFrom=today();D.keyUntil=exp;persist();document.getElementById('keyMsg').textContent='හරි!'; render(); go('home');}
function addInc(n,a){D.inc.push({name:n,amount:a,date:today()});persist();render();}
function addExp(cat,n,a){D.exp.push({cat:cat,name:n,amount:a,date:today()});persist();render();}
function addMust(n,a,date){D.must.push({name:n,amount:a,date:date});persist();render();}
function curMust(){return D.must.filter(function(x){return x.date.slice(0,7)===month()})}
function totals(){var mo=month();var inc=D.inc.filter(function(x){return x.date.slice(0,7)===mo}).reduce(function(a,b){return a+b.amount},0);var exp=D.exp.filter(function(x){return x.date.slice(0,7)===mo}).reduce(function(a,b){return a+b.amount},0);var must=curMust().reduce(function(a,b){return a+b.amount},0);var td=D.exp.filter(function(x){return x.date===today()}).reduce(function(a,b){return a+b.amount},0);return {inc:inc,exp:exp,must:must,bal:inc-must-exp,td:td};}
function openCard(k){var t=totals(); var title={inc:'මාසික ආදායම',exp:'මාසික වියදම',bal:'ඉතිරිය',today:'අද වියදම'}[k]; var rows=''; if(k==='inc')rows=D.inc.filter(function(x){return x.date.slice(0,7)===month()}).map(function(x){return '<div class="row"><span>'+x.name+' ('+x.date+')</span><b>රු. '+x.amount.toLocaleString()+'</b></div>'}).join('')||'කිසිවක් නැත'; if(k==='exp'||k==='bal')rows=D.exp.filter(function(x){return x.date.slice(0,7)===month()}).map(function(x){return '<div class="row"><span>'+x.cat+' - '+x.name+' ('+x.date+')</span><b>රු. '+x.amount.toLocaleString()+'</b></div>'}).join('')||'කිසිවක් නැත'; if(k==='bal')rows='<div>ආදායම රු. '+t.inc.toLocaleString()+' - අනිවාර්ය ගෙවීම් රු. '+t.must.toLocaleString()+' - වියදම රු. '+t.exp.toLocaleString()+' = <b>ඉතිරිය රු. '+t.bal.toLocaleString()+'</b></div><br>'+rows; if(k==='today')rows=D.exp.filter(function(x){return x.date===today()}).map(function(x){return '<div class="row"><span>'+x.cat+' - '+x.name+'</span><b>රු. '+x.amount.toLocaleString()+'</b></div>'}).join('')||'අද වියදමක් නැත'; document.getElementById('dTitle').textContent=title; document.getElementById('dForm').innerHTML=''; document.getElementById('dTable').innerHTML=rows; go('detail');}
function openPage(p){if(p==='must'){document.getElementById('dTitle').textContent='අනිවාර්ය ගෙවීම්'; document.getElementById('dForm').innerHTML='<input class="inp" id="fName" placeholder="කාරණය - උදා: ලයිට් බිල"><input class="inp" id="fAmt" type="number" placeholder="මුදල"><input class="inp" id="fDate" type="date"><button class="save" onclick="saveMust()">Save</button>'; renderMustTable(); go('detail');}}
function saveMust(){var n=document.getElementById('fName').value,a=parseFloat(document.getElementById('fAmt').value||0),d=document.getElementById('fDate').value; if(!n||!a||!d)return alert('නම + මුදල + දිනය දාන්න'); addMust(n,a,d); renderMustTable();}
function renderMustTable(){var rows=curMust().map(function(x){return '<div class="row"><span>'+x.name+' - '+x.date+'</span><span><b>රු. '+x.amount.toLocaleString()+'</b> <button class="phone" onclick="phoneAlarm(\''+x.date+'\',\''+x.name.replace(/'/g,'')+'\')">📱 Phone Alarm</button></span></div>'}).join('')||'කිසිවක් නැත'; var t=totals(); document.getElementById('dTable').innerHTML='<div>මුලු අනිවාර්ය ගෙවීම්: <b>රු. '+t.must.toLocaleString()+'</b> | ආදායමෙන් අඩු කළ පසු ඉතිරිය: <b>රු. '+(t.inc-t.must).toLocaleString()+'</b></div><br>'+rows;}
function openCat(cat){document.getElementById('dTitle').textContent=cat; document.getElementById('dForm').innerHTML='<input class="inp" id="fName" placeholder="මොකටද"><input class="inp" id="fAmt" type="number" placeholder="මුදල"><button class="save" onclick="saveCat(\''+cat+'\')">Save</button>'; renderCatTable(cat); go('detail');}
function saveCat(cat){var n=document.getElementById('fName').value,a=parseFloat(document.getElementById('fAmt').value||0); if(!a)return alert('මුදල දාන්න'); addExp(cat,n||cat,a); renderCatTable(cat);}
function renderCatTable(cat){var rows=D.exp.filter(function(x){return x.cat===cat&&x.date.slice(0,7)===month()}).map(function(x){return '<div class="row"><span>'+(x.name||cat)+' ('+x.date+')</span><b>රු. '+x.amount.toLocaleString()+'</b></div>'}).join('')||'කිසිවක් නැත'; document.getElementById('dTable').innerHTML=rows;}
function phoneAlarm(date,name){try{var d=new Date(date+'T08:00:00'); var url='intent://#Intent;action=android.intent.action.SET_ALARM;S.android.intent.extra.alarm.MESSAGE='+encodeURIComponent(name)+';i.android.intent.extra.alarm.HOUR=8;i.android.intent.extra.alarm.MINUTES=0;end'; window.location.href=url; setTimeout(function(){alert('Phone Alarm එකේ Save ඔබන්න: '+date+' - '+name)},600);}catch(e){alert('Phone Alarm එක Open කරන්න බැරි වුනා')}}
function saveSet(k){if(k==='home'){D.home=document.getElementById('setHome').value}else{D.budget=document.getElementById('setBudget').value}persist();document.getElementById('setMsg').textContent='Saved';}
function openManage(cat){var rows=''; if(cat==='ආදායම')rows=D.inc.map(function(x,i){return '<div class="row"><span>'+x.name+' - රු. '+x.amount+'</span><button class="phone" onclick="delItem(\'inc\','+i+')">Delete</button></div>'}).join(''); else if(cat==='අනිවාර්ය ගෙවීම්')rows=D.must.map(function(x,i){return '<div class="row"><span>'+x.name+' - '+x.date+' - රු. '+x.amount+'</span><button class="phone" onclick="delItem(\'must\','+i+')">Delete</button></div>'}).join(''); else rows=D.exp.map(function(x,i){return x.cat===cat?'<div class="row"><span>'+x.name+' - රු. '+x.amount+' ('+x.date+')</span><button class="phone" onclick="delItem(\'exp\','+i+')">Delete</button></div>':''}).join(''); document.getElementById('manageList').innerHTML='<b>'+cat+'</b><br>'+(rows||'කිසිවක් නැත');}
function delItem(type,i){if(!confirm('මකන්නද?'))return; if(type==='inc')D.inc.splice(i,1); if(type==='must')D.must.splice(i,1); if(type==='exp')D.exp.splice(i,1); persist(); render(); document.getElementById('manageList').innerHTML='Deleted - නැවත Category එක තෝරන්න';}
function render(){var t=totals(); document.getElementById('sInc').textContent='රු. '+t.inc.toLocaleString(); document.getElementById('sExp').textContent='රු. '+t.exp.toLocaleString(); document.getElementById('sBal').textContent='රු. '+t.bal.toLocaleString(); document.getElementById('sBal').style.color=t.bal<0?'#DC2626':'#0A2540'; document.getElementById('sToday').textContent='රු. '+t.td.toLocaleString(); var now=new Date(); document.getElementById('ym').textContent=now.getFullYear()+' - '+MONTHS[now.getMonth()]; document.getElementById('repMonth').textContent=MONTHS[now.getMonth()]+' '+now.getFullYear(); var el=document.getElementById('trialLabel'); var ks=document.getElementById('keyStatus'); if(isActivated()){el.textContent='Activated - '+(D.keyLabel||'')+' | Until '+D.keyUntil; el.style.background='#4ADE80'; ks.textContent='Activated - '+(D.keyLabel||'')+' | From '+(D.keyFrom||'')+' Until '+D.keyUntil;} else {var dl=daysLeft(); if(dl>0){el.textContent='Trial Version - දින '+dl+'යි'; el.style.background='#FACC15'; el.style.color='#0A2540'; ks.textContent='Trial Version - දින '+dl+'යි ඉතිරි. Install කරපු දින සිට දින 7යි.';} else {el.textContent='Trial ඉවරයි - Key එක දාන්න'; el.style.background='#F87171'; ks.textContent='Trial ඉවරයි. Key එක දාන්න.';}} document.getElementById('setHome').value=D.home||''; document.getElementById('setBudget').value=D.budget||'';}
function renderReport(){var t=totals(); var byCat={}; D.exp.filter(function(x){return x.date.slice(0,7)===month()}).forEach(function(x){byCat[x.cat]=(byCat[x.cat]||0)+x.amount}); var catHtml=Object.keys(byCat).map(function(k){return k+' : රු. '+byCat[k].toLocaleString()}).join('<br>'); document.getElementById('repSummary').innerHTML='මාසික ආදායම: රු. '+t.inc.toLocaleString()+'<br>අනිවාර්ය ගෙවීම්: රු. '+t.must.toLocaleString()+'<br>මාසික වියදම: රු. '+t.exp.toLocaleString()+'<br>ඉතිරිය: රු. '+t.bal.toLocaleString()+'<br><br><b>Category වෙන් වෙන්ව:</b><br>'+(catHtml||'කිසිවක් නැත'); var cal=document.getElementById('cal'); cal.innerHTML=''; var days=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate(); for(var d=1;d<=days;d++){var ds=month()+'-'+('0'+d).slice(-2); var has=D.exp.some(function(x){return x.date===ds})||D.inc.some(function(x){return x.date===ds}); var div=document.createElement('div'); div.textContent=d; if(has)div.className='has'; div.onclick=(function(ds){return function(){var e=D.exp.filter(function(x){return x.date===ds}); var i=D.inc.filter(function(x){return x.date===ds}); document.getElementById('dayDetail').innerHTML='<b>'+ds+'</b><br>ආදායම: රු. '+i.reduce(function(a,b){return a+b.amount},0)+'<br>වියදම: රු. '+e.reduce(function(a,b){return a+b.amount},0)+'<br>'+e.map(function(x){return x.cat+' - '+x.name+' - රු. '+x.amount}).join('<br>')}})(ds); cal.appendChild(div);}}
function renderManage(c){document.getElementById('manageList').innerHTML='Category එකක් තෝරන්න';}
function downloadPDF(){var w=window.open('','_blank'); w.document.write('<h2>HOME BUDGET - '+month()+'</h2><pre>'+document.getElementById('repSummary').innerText+'</pre>'); w.print();}
render(); go('home');
</script>
